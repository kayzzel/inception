services:
  nginx:
    container_name: nginx
    networks:
      - inception-net
    volumes:
      - wordpress:/var/www/html
    restart: always
  wordpress:
    container_name: wordpress
    networks:
      - inception-net
    volumes:
      - wordpress:/var/www/html
    restart: always
  mariadb:
    build:
      context: ./requirements/mariadb
    image: mariadb
    container_name: mariadb
    networks:
      - inception-net
    volumes:
      - mariadb:/var/lib/mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
    secrets:
      - db_root_password
      - db_password

volumes:
  wordpress:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/gabach/data/wordpress
  mariadb:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/gabach/data/mariadb

networks:
  inception-net:
    name: inception-net
    driver: bridge

secrets:
  db_root_password:
    file: ../secrets/db_root_password.txt
  db_password:
    file: ../secrets/db_password.txt
  credentials:
    file: ../secrets/credentials.txt
